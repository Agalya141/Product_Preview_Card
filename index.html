<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Product Preview Card</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=...&display=swap" rel="stylesheet">
    </head>
    <body>
        <main class="product-preview-card">
            <section class="image">
                <picture>
                    <source media="(max-width:32.5rem)" srcset="image-product-mobile.jpg">
                <img src="image-product-mobile.jpg" alt="perfume image" class="perfume_image_mobile" width="500" height="400">
                 </picture>
                <picture>
                    <source media="(min-width:32.5rem)" srcset="image-product-desktop.jpg">
                <img src="image-product-desktop.jpg" alt="perfume image" class="perfume_image_desktop" width="400" height="500">
               </picture>
            </section>
            <div class="text_section">
           
                <p class="about_image">PERFUME</p>
                <h1>Gabrielle Essence Eau De Parfum</h1>
                <p class="about_perfume">A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.</p>
                <p class="amount"><span class="price">$149.99</span><s class="actual_price">$169.99</s></p>
                <button>
                    <img src="icon-cart.svg" alt="cart image">
                    <span class="cart-text">Add to Cart</span>
                </button>
              
            </div>
        </main>
    </body>
</html>
