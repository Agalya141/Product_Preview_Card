<!Doctype html>
<html lang="en">
    <head>
        <title>Product Preview Card</title>
        <meta name="viewport" device="device-width, initial-scale:0.1">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <main class="product-preview-card">
            <section class="image">
                <img src="image-product-mobile.jpg" alt="perfume image">
                <p class="about image">PERFUME</p>
            </section>
            <section class="text">
                <h1>Gabrielle Essence Eau De Parfum</h1>
                <p>A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.</p>
            </section>
            <section>
                <p class="amount"><span class="price">$149.99</span><span class="actual-price">$169.99</span></p>
                <button>
                    <image src="icon-cart.svg" alt="cart image">
                    <p class="cart-text">Add to Cart</p>
                </button>
            </section>
        </main>
    </body>
</html>
